    Servicios:
      name: "Servicios"
      markdown: "Servicios de acceso a datos y plataformas (Supabase, Storage)."
    Estado:
      name: "Estado"
      markdown: "Gestión de estado y proveedores."
    Widgets:
      name: "Widgets"
      markdown: "Componentes de UI reutilizables."
    Configuración:
      name: "Configuración"
      markdown: "Inicialización y configuración de SDKs."
  categorizeLibraries: true
